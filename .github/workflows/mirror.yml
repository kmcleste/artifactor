name: Mirror URL to Artifact

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to download and mirror"
        required: true
        type: string
      filename:
        description: "Output filename (leave blank to infer from URL)"
        required: false
        type: string
      tag:
        description: "Release tag (leave blank to auto-generate: mirror-YYYYMMDD-HHMMSS)"
        required: false
        type: string
      release_name:
        description: "Release title (leave blank to use the tag)"
        required: false
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases and upload assets

    steps:
      - name: Validate URL
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [[ ! "$INPUT_URL" =~ ^https?:// ]]; then
            echo "::error::URL must start with http:// or https://"
            exit 1
          fi

      - name: Resolve filename and tag
        id: resolve
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_FILENAME: ${{ inputs.filename }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          # Filename
          if [[ -n "$INPUT_FILENAME" ]]; then
            SAFE_NAME=$(basename "$INPUT_FILENAME")
          else
            SAFE_NAME=$(basename "${INPUT_URL%%\?*}")
            [[ -z "$SAFE_NAME" || "$SAFE_NAME" == "/" ]] && SAFE_NAME="download"
          fi

          # Tag
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="mirror-$(date -u +%Y%m%d-%H%M%S)"
          fi

          # Release title
          RELEASE_NAME="${INPUT_RELEASE_NAME:-$TAG}"

          echo "filename=$SAFE_NAME"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          echo "Filename : $SAFE_NAME"
          echo "Tag      : $TAG"
          echo "Release  : $RELEASE_NAME"

      - name: Download file
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          OUT_FILE: ${{ steps.resolve.outputs.filename }}
        run: |
          mkdir -p download
          echo "Fetching: $INPUT_URL"
          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 300 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            --output "download/$OUT_FILE" \
            -- "$INPUT_URL"
          ls -lh "download/$OUT_FILE"

      - name: Create release and upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_NAME: ${{ steps.resolve.outputs.release_name }}
          OUT_FILE: ${{ steps.resolve.outputs.filename }}
          SOURCE_URL: ${{ inputs.url }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Mirrored from: $SOURCE_URL" \
            "download/$OUT_FILE"

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUT_FILE}"
          echo ""
          echo "========================================"
          echo "  Public download URL:"
          echo "  $DOWNLOAD_URL"
          echo "========================================"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
